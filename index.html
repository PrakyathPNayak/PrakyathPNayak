<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Best-effort orientation hint for browsers that honour it (UC/QQ/KaiOS).
         Real enforcement is done at runtime in js/mobile.js via the
         Screen Orientation API + a rotate overlay. -->
    <title>Prakyath P Nayak — Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Prakyath P Nayak — systems, robotics, graphics and distributed computing."
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/intro.css" />
    <link rel="stylesheet" href="css/room.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <!-- LANDSCAPE GATE: shown on mobile portrait viewports (see js/mobile.js).
         Covers intro + room so the viewer only ever sees the site in landscape. -->
    <div id="rotate-overlay" hidden>
      <div class="rotate-card" role="dialog" aria-modal="true" aria-label="Rotate your device">
        <svg class="rotate-phone" viewBox="0 0 64 64" aria-hidden="true">
          <g class="rotate-phone-body">
            <rect x="22" y="6" width="20" height="38" rx="4" />
            <rect class="rotate-phone-screen" x="25" y="11" width="14" height="25" rx="1" />
            <circle class="rotate-phone-btn" cx="32" cy="40" r="1.6" />
          </g>
          <g class="rotate-arrows" fill="none" stroke-linecap="round">
            <path d="M50 18 A 20 20 0 0 1 50 46" />
            <path d="M54 41 L50 47 L44 43" />
            <path d="M14 46 A 20 20 0 0 1 14 18" />
            <path d="M10 23 L14 17 L20 21" />
          </g>
        </svg>
        <p class="rotate-title">Rotate your device</p>
        <p class="rotate-sub">
          This experience is landscape-only. Turn your phone sideways to continue.
        </p>
        <button id="rotate-fullscreen" class="rotate-action" type="button">
          Enter landscape &amp; fullscreen
        </button>
      </div>
    </div>

    <!-- INTRO OVERLAY: dismiss with any key / click / tap.
       When dismissed it fires `intro:complete` on window and calls
       queued `Intro.onComplete` callbacks. Build the next scene behind
       #app or listen for that event (see intro.js). -->
    <div
      id="intro"
      role="button"
      tabindex="0"
      aria-label="Intro animation. Press any key or click anywhere to begin."
    >
      <canvas id="film"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <header class="titles" aria-hidden="true">
        <p id="line1" class="title-line">A Shiny Cube presents:</p>
        <h1 id="line2" class="title-line">Portfolio: <span class="name">Prakyath P Nayak</span></h1>
      </header>
      <p id="hint" class="hint" aria-hidden="true">click anywhere to begin</p>
    </div>

    <!-- ROOM: 4 walls + ceiling, navigated with on-screen or keyboard
       arrows. Started by room.js on `intro:complete`. -->
    <main id="app" hidden>
      <section class="room-stage">
        <div id="room-view" class="room-view" role="region" aria-label="Room view: wall 1">
          <div id="room-scene" class="room-scene">
            <img id="room-img" src="images/wall.jpg" alt="" draggable="false" />
            <div id="doors" class="doors">
              <button
                class="door door-yt"
                type="button"
                data-door="0"
                aria-label="YouTube — A Shiny Cube"
              >
                <img src="images/door-yt.png" alt="" draggable="false" />
              </button>
              <button
                class="door door-in"
                type="button"
                data-door="1"
                aria-label="LinkedIn — Prakyath P Nayak"
              >
                <img src="images/door-linkedin.png" alt="" draggable="false" />
              </button>
              <button
                class="door door-gh"
                type="button"
                data-door="2"
                aria-label="GitHub — PrakyathPNayak"
              >
                <img src="images/door-github.png" alt="" draggable="false" />
              </button>
            </div>
            <div id="art" class="art"></div>
          </div>
          <div class="room-vignette" aria-hidden="true"></div>
          <p id="room-toast" class="room-toast" aria-hidden="true">
            use the arrows on the screen or your keyboard to move around
          </p>
          <p id="door-toast" class="room-toast" aria-hidden="true"></p>
          <p id="door-tag" class="door-tag" aria-hidden="true"></p>
          <div id="art-toast" class="art-toast" aria-live="polite">
            <h3 class="art-toast-title"></h3>
            <p class="art-toast-desc"></p>
            <p class="art-toast-hint"></p>
          </div>
          <button id="arrow-up" class="arrow arrow-up" type="button" aria-label="Look up">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l10 14H2z" /></svg>
          </button>
          <button
            id="arrow-down"
            class="arrow arrow-down"
            type="button"
            aria-label="Look down"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19L2 5h20z" /></svg>
          </button>
          <button id="arrow-left" class="arrow arrow-left" type="button" aria-label="Turn left">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l14-10v20z" /></svg>
          </button>
          <button id="arrow-right" class="arrow arrow-right" type="button" aria-label="Turn right">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12L5 2v20z" /></svg>
          </button>
          <button
            id="fs-toggle"
            class="fs-toggle"
            type="button"
            aria-label="Toggle fullscreen"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script src="js/mobile.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/room.js"></script>
  </body>
</html>
